[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "auth-ai"
version = "0.2.1"
description = "Python SDK for applications relying on a CIRCLE auth-service identity provider: OIDC sign-in (backend-for-frontend), entitlements, billing, credit wallet and LiteLLM gateway."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CIRCLE" }]
keywords = [
  "oidc",
  "openid-connect",
  "oauth2",
  "oauth2.1",
  "pkce",
  "authentication",
  "authorization",
  "sso",
  "identity-provider",
  "bff",
  "backend-for-frontend",
  "back-channel-logout",
  "session",
  "jwt",
  "rbac",
  "entitlements",
  "subscription",
  "billing",
  "usage-based-billing",
  "litellm",
  "llm",
  "ai-gateway",
  "token-wallet",
  "credits",
  "mcp",
  "fastapi",
  "starlette",
  "asyncio",
  "httpx",
  "self-hosted",
  "circle",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Session",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "httpx2[brotli,http2]>=2.16",
  "joserfc>=1.7",
  "pydantic>=2.12",
]

[project.optional-dependencies]
starlette = ["starlette>=0.46"]
fastapi = ["fastapi>=0.115"]

[project.urls]
Homepage = "https://github.com/circle-rd/auth-ai-py"
Documentation = "https://docs.circle-cyber.com/auth-ai/python"
Repository = "https://github.com/circle-rd/auth-ai-py"
Issues = "https://github.com/circle-rd/auth-ai-py/issues"
Changelog = "https://github.com/circle-rd/auth-ai-py/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "fastapi>=0.115",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "respx>=0.22",
  "ruff>=0.9",
  "starlette>=0.46",
  "uvicorn>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/auth_ai"]

[tool.hatch.build.targets.sdist]
include = ["src/auth_ai", "README.md", "LICENSE", "CHANGELOG.md"]

# ── Tooling ──

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "A",
  "C4",
  "SIM",
  "RUF",
  "S",
  "T20",
  "ANN",
  "ASYNC",
  "BLE",
  "FBT",
  "PT",
  "TCH",
  "PL",
  "PERF",
  "RET",
  "TRY",
]
ignore = [
  "TRY003", # messages live in the error registry call sites
  "PLR2004", # protocol constants are self-explanatory in context
  "PLR0913", # keyword-only option lists are the API
  "S105", # `token_endpoint_auth_method` names a method, not a password
  "PLR0911", # a request handler answers with one return per refusal
]

[tool.ruff.lint.per-file-ignores]
# The registry mirrors the SDK error codes: DOMAIN_NNN attribute names are the contract.
"src/auth_ai/errors.py" = ["N815", "N802"]
"tests/**" = ["S101", "S105", "S106", "S108", "ANN", "PLR", "SLF001", "TRY", "TC", "FBT", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["auth_ai"]

# Pydantic reads the annotations of its models at runtime.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "auth_ai.http.ApiModel"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests", "examples/minimal/app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["brotli"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["auth_ai"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$"]
